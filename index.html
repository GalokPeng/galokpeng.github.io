<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#0d1838" />
    <meta
      name="description"
      content="个人站点中转站 —— 漂浮在真实海水之上的入口"
    />
    <title>Galok · 海上浮岛</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css?v=20260801-3" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 4c4 6 8 9 8 14a8 8 0 0 1-16 0c0-5 4-8 8-14z' fill='%234a9fd6'/%3E%3C/svg%3E"
    />
  </head>
  <body data-theme="auto">
    <!-- 海洋画布（背景层） -->
    <canvas id="ocean-canvas" aria-hidden="true"></canvas>

    <!-- 顶部信息与主题切换 -->
    <header class="hud">
      <div class="hud-brand">
        <span class="hud-mark">≋</span>
        <span class="hud-name" id="site-name">Galok</span>
      </div>
      <div class="hud-actions">
        <span class="hud-clock" id="clock" title="天空观测点当地时间"></span>
        <span class="hud-mode" id="hud-mode" aria-live="polite">自动</span>
        <button
          class="time-scale-btn"
          id="time-scale"
          type="button"
          aria-label="调整时间流速"
          title="时间流速：1×"
        >1×</button>
        <button
          class="weather-btn"
          id="weather-rain"
          type="button"
          aria-label="切换下雨"
          title="下雨开关（随机）"
        >
          <svg
            class="ico-rain"
            viewBox="0 0 24 24"
            width="18"
            height="18"
            aria-hidden="true"
          >
            <path
              d="M6.5 12.5a3.5 3.5 0 0 1 .5-2 4 4 0 0 1 7.6 1.2 3 3 0 0 1 .4 5.8H7a3 3 0 0 1-.5-5z"
              fill="currentColor"
            />
            <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <line x1="8" y1="18.5" x2="7" y2="21.5" />
              <line x1="12" y1="18.5" x2="11" y2="21.5" />
              <line x1="16" y1="18.5" x2="15" y2="21.5" />
            </g>
          </svg>
          <span class="weather-badge" aria-hidden="true"></span>
        </button>
        <button
          class="weather-btn"
          id="weather-lightning"
          type="button"
          aria-label="切换闪电"
          title="闪电开关（随机）"
        >
          <svg
            class="ico-bolt"
            viewBox="0 0 24 24"
            width="18"
            height="18"
            aria-hidden="true"
          >
            <path d="M13 2 L5 13 h5 l-2 9 9-12 h-5 z" fill="currentColor" />
          </svg>
          <span class="weather-badge" aria-hidden="true"></span>
        </button>
        <button
          class="theme-toggle"
          id="theme-toggle"
          type="button"
          aria-label="切换昼夜主题"
          title="切换昼夜主题"
        >
          <svg
            class="ico-sun"
            viewBox="0 0 24 24"
            width="18"
            height="18"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4.2" fill="currentColor" />
            <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
              <line x1="12" y1="2.5" x2="12" y2="5" />
              <line x1="12" y1="19" x2="12" y2="21.5" />
              <line x1="2.5" y1="12" x2="5" y2="12" />
              <line x1="19" y1="12" x2="21.5" y2="12" />
              <line x1="5.2" y1="5.2" x2="6.9" y2="6.9" />
              <line x1="17.1" y1="17.1" x2="18.8" y2="18.8" />
              <line x1="5.2" y1="18.8" x2="6.9" y2="17.1" />
              <line x1="17.1" y1="6.9" x2="18.8" y2="5.2" />
            </g>
          </svg>
          <svg
            class="ico-moon"
            viewBox="0 0 24 24"
            width="18"
            height="18"
            aria-hidden="true"
          >
            <path
              d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"
              fill="currentColor"
            />
          </svg>
          <span class="auto-badge" aria-hidden="true"></span>
          <svg
            class="ico-dusk"
            viewBox="0 0 24 24"
            width="18"
            height="18"
            aria-hidden="true"
          >
            <path
              d="M2 16 H22"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
            <path d="M7 16 A5 5 0 0 1 17 16 Z" fill="currentColor" />
            <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
              <line x1="12" y1="5.5" x2="12" y2="7.6" />
              <line x1="6.4" y1="8.2" x2="7.7" y2="9.5" />
              <line x1="17.6" y1="8.2" x2="16.3" y2="9.5" />
            </g>
          </svg>
        </button>
      </div>
    </header>

    <!-- 中央标语 -->
    <section class="tagline" aria-hidden="true">
      <h1 class="tagline-title">漂 浮 的 入 口</h1>
      <p class="tagline-sub">
        Tap an island to set sail · 点亮一座岛屿，扬帆远航
      </p>
    </section>

    <!-- 海面漂浮物容器（由 app.js 动态填充） -->
    <main class="islands" id="islands" aria-label="站点入口"></main>

    <!-- 底部水波提示 -->
    <footer class="footer-hint" aria-hidden="true">
      <span>· 拨动水面，留下涟漪 ·</span>
    </footer>

    <!-- 视角切换：自动 / 日出 / 日落 / 月升 / 月落（auto 模式下生效） -->
    <aside class="view-panel" id="view-panel" aria-label="视角切换">
      <button
        class="view-btn is-active"
        data-view="auto"
        type="button"
        title="自动视角：自由拖动"
      >自动</button>
      <button
        class="view-btn"
        data-view="sunrise"
        type="button"
        title="跳到日出时刻并对准东方"
      >日出</button>
      <button
        class="view-btn"
        data-view="sunset"
        type="button"
        title="跳到日落时刻并对准西方"
      >日落</button>
      <button
        class="view-btn"
        data-view="moonrise"
        type="button"
        title="跳到月升时刻并对准月亮"
      >月升</button>
      <button
        class="view-btn"
        data-view="moonset"
        type="button"
        title="跳到月落时刻并对准月亮"
      >月落</button>
    </aside>

    <script src="./water.js?v=20260801-4"></script>
    <script src="./app.js?v=20260801-4"></script>
  </body>
</html>
